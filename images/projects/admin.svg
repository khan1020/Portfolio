<svg width="900" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="500" fill="#f1f5f9"/>
  
  <!-- Sidebar -->
  <rect width="220" height="500" fill="#0f172a"/>
  <text x="30" y="40" font-family="Arial" font-size="20" font-weight="bold" fill="white">AdminPanel</text>
  
  <rect x="20" y="80" width="180" height="35" fill="#1e293b" rx="8"/>
  <text x="40" y="104" font-family="Arial" font-size="13" fill="#3b82f6">● Dashboard</text>
  
  <text x="40" y="150" font-family="Arial" font-size="13" fill="#94a3b8">○ Users</text>
  <text x="40" y="180" font-family="Arial" font-size="13" fill="#94a3b8">○ Orders</text>
  <text x="40" y="210" font-family="Arial" font-size="13" fill="#94a3b8">○ Products</text>
  <text x="40" y="240" font-family="Arial" font-size="13" fill="#94a3b8">○ Analytics</text>
  
  <!-- Main Content -->
  <text x="260" y="45" font-family="Arial" font-size="26" font-weight="bold" fill="#0f172a">Dashboard Overview</text>
  
  <!-- Stat Cards -->
  <rect x="260" y="70" width="150" height="90" fill="white" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="290" cy="100" r="20" fill="#dbeafe"/>
  <text x="283" y="108" font-family="Arial" font-size="18" fill="#3b82f6">👥</text>
  <text x="280" y="140" font-family="Arial" font-size="24" font-weight="bold" fill="#0f172a">1,234</text>
  <text x="280" y="155" font-family="Arial" font-size="12" fill="#64748b">Total Users</text>
  
  <rect x="430" y="70" width="150" height="90" fill="white" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="460" cy="100" r="20" fill="#d1fae5"/>
  <text x="453" y="108" font-family="Arial" font-size="18" fill="#10b981">📦</text>
  <text x="450" y="140" font-family="Arial" font-size="24" font-weight="bold" fill="#0f172a">856</text>
  <text x="450" y="155" font-family="Arial" font-size="12" fill="#64748b">Total Orders</text>
  
  <rect x="600" y="70" width="150" height="90" fill="white" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="630" cy="100" r="20" fill="#ede9fe"/>
  <text x="623" y="108" font-family="Arial" font-size="18" fill="#8b5cf6">💰</text>
  <text x="620" y="140" font-family="Arial" font-size="24" font-weight="bold" fill="#0f172a">$48k</text>
  <text x="620" y="155" font-family="Arial" font-size="12" fill="#64748b">Revenue</text>
  
  <!-- Chart Area -->
  <rect x="260" y="180" width="490" height="200" fill="white" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <text x="280" y="205" font-family="Arial" font-size="14" font-weight="bold" fill="#0f172a">Revenue Analytics</text>
  
  <!-- Simple Line Chart -->
  <polyline points="280,340 320,320 360,310 400,330 440,300 480,290 520,280 560,270 600,260 640,240 680,220 720,250" 
            fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  <polyline points="280,360 320,320 360,310 400,330 440,300 480,290 520,280 560,270 600,260 640,240 680,220 720,250 720,360" 
            fill="url(#gradient)" opacity="0.3"/>
  
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Grid lines -->
  <line x1="280" y1="240" x2="720" y2="240" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="280" y1="280" x2="720" y2="280" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="280" y1="320" x2="720" y2="320" stroke="#f1f5f9" stroke-width="1"/>
  
  <!-- Users Table Preview -->
  <rect x="260" y="395" width="490" height="90" fill="white" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <text x="280" y="420" font-family="Arial" font-size="14" font-weight="bold" fill="#0f172a">Recent Users</text>
  
  <circle cx="290" cy="450" r="12" fill="#3b82f6"/>
  <text x="310" y="455" font-family="Arial" font-size="12" fill="#1f2937">John Doe</text>
  <text x="450" y="455" font-family="Arial" font-size="11" fill="#64748b">john@example.com</text>
  <rect x="650" y="443" width="60" height="20" fill="#d1fae5" rx="10"/>
  <text x="663" y="456" font-family="Arial" font-size="10" fill="#065f46">Active</text>
  
  <circle cx="290" cy="475" r="12" fill="#8b5cf6"/>
  <text x="310" y="480" font-family="Arial" font-size="12" fill="#1f2937">Sarah Dev</text>
  <text x="450" y="480" font-family="Arial" font-size="11" fill="#64748b">sarah@example.com</text>
  <rect x="650" y="468" width="60" height="20" fill="#d1fae5" rx="10"/>
  <text x="663" y="481" font-family="Arial" font-size="10" fill="#065f46">Active</text>
</svg>
