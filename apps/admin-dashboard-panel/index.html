<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo"><i class="fas fa-cube"></i> AdminPanel</div>
            <button class="sidebar-toggle" id="sidebarToggle">
                <i class="fas fa-bars"></i>
            </button>
        </div>
        <nav>
            <a href="#dashboard" class="nav-link active" data-page="dashboard">
                <i class="fas fa-home"></i> <span>Dashboard</span>
            </a>
            <a href="#users" class="nav-link" data-page="users">
                <i class="fas fa-users"></i> <span>Users</span>
            </a>
            <a href="#products" class="nav-link" data-page="products">
                <i class="fas fa-box"></i> <span>Products</span>
            </a>
            <a href="#orders" class="nav-link" data-page="orders">
                <i class="fas fa-shopping-cart"></i> <span>Orders</span>
            </a>
            <a href="#analytics" class="nav-link" data-page="analytics">
                <i class="fas fa-chart-bar"></i> <span>Analytics</span>
            </a>
            <a href="#settings" class="nav-link" data-page="settings">
                <i class="fas fa-cog"></i> <span>Settings</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <a href="../../index.html" class="nav-link">
                <i class="fas fa-arrow-left"></i> <span>Back to Portfolio</span>
            </a>
            <button class="logout-btn" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main">
        <div class="header">
            <div class="header-left">
                <button class="mobile-menu-btn" id="mobileMenuBtn">
                    <i class="fas fa-bars"></i>
                </button>
                <h1 id="pageTitle">Dashboard Overview</h1>
            </div>
            <div class="header-right">
                <button class="theme-toggle" id="themeToggle">
                    <i class="fas fa-sun sun-icon"></i>
                    <i class="fas fa-moon moon-icon"></i>
                </button>
                <div class="user-info">
                    <span class="user-name" id="userName">Admin</span>
                    <div class="user-avatar">A</div>
                </div>
            </div>
        </div>

        <!-- Page Container -->
        <div class="content-container" id="pageContainer">
            <!-- Pages will be loaded here dynamically -->
        </div>
    </main>

    <!-- Notification -->
    <div id="notification" class="notification"></div>

    <!-- Modal Container -->
    <div id="modalContainer"></div>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/pages.js"></script>
    <script src="js/crud.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
