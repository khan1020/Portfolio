<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShortLink - URL Shortener</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header i {
            font-size: 3rem;
            color: #0ea5e9;
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 2rem;
            color: #1f2937;
        }

        .header p {
            color: #6b7280;
            margin-top: 10px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-group input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 1rem;
        }

        .input-group input:focus {
            outline: none;
            border-color: #0ea5e9;
        }

        .input-group button {
            padding: 15px 30px;
            background: #0ea5e9;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .result {
            background: #f0f9ff;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-url {
            font-weight: 600;
            color: #0ea5e9;
            word-break: break-all;
        }

        .copy-btn {
            background: #0ea5e9;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .table-container {
            margin-top: 30px;
        }

        .table-container h3 {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f9fafb;
            font-weight: 600;
            color: #6b7280;
            font-size: 0.85rem;
        }

        .url-cell {
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .clicks-badge {
            background: #dbeafe;
            color: #1d4ed8;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .short-link {
            color: #0ea5e9;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }

        .delete-btn {
            color: #9ca3af;
            cursor: pointer;
            background: none;
            border: none;
        }

        .delete-btn:hover {
            color: #ef4444;
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <i class="fas fa-link"></i>
                <h1>ShortLink</h1>
                <p>Shorten your URLs and track clicks</p>
            </div>

            <div class="alert alert-error" id="errorAlert" style="display:none;"><i
                    class="fas fa-exclamation-circle"></i> Please enter a valid URL</div>

            <form onsubmit="shortenUrl(event)">
                <div class="input-group">
                    <input type="url" id="urlInput" placeholder="Paste your long URL here..." required>
                    <button type="submit"><i class="fas fa-bolt"></i> Shorten</button>
                </div>
            </form>

            <div class="result" id="result" style="display:none;">
                <span class="result-url" id="shortUrl"></span>
                <button class="copy-btn" onclick="copyUrl()"><i class="fas fa-copy"></i> Copy</button>
            </div>

            <div class="table-container">
                <h3><i class="fas fa-history"></i> Recent Links</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Short Link</th>
                            <th>Original URL</th>
                            <th>Clicks</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="urlList"></tbody>
                </table>
            </div>
        </div>
        <a href="../../index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Portfolio</a>
    </div>

    <script>
        let urls = JSON.parse(localStorage.getItem('portfolio_urls')) || [];

        function saveUrls() { localStorage.setItem('portfolio_urls', JSON.stringify(urls)); }

        function generateCode() {
            return Math.random().toString(36).substring(2, 8);
        }

        function shortenUrl(e) {
            e.preventDefault();
            const input = document.getElementById('urlInput');
            const url = input.value.trim();

            // Check if already shortened
            const existing = urls.find(u => u.original === url);
            if (existing) {
                showResult(existing.code);
                return;
            }

            const code = generateCode();
            urls.unshift({ id: Date.now(), original: url, code: code, clicks: 0, created: Date.now() });
            saveUrls();
            renderUrls();
            showResult(code);
            input.value = '';
        }

        function showResult(code) {
            const shortUrl = window.location.origin + '/s/' + code;
            document.getElementById('shortUrl').textContent = shortUrl;
            document.getElementById('result').style.display = 'flex';
        }

        function copyUrl() {
            navigator.clipboard.writeText(document.getElementById('shortUrl').textContent);
            const btn = event.target.closest('button');
            btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
            setTimeout(() => btn.innerHTML = '<i class="fas fa-copy"></i> Copy', 2000);
        }

        function visitUrl(id) {
            const url = urls.find(u => u.id === id);
            if (url) {
                url.clicks++;
                saveUrls();
                renderUrls();
                window.open(url.original, '_blank');
            }
        }

        function deleteUrl(id) {
            urls = urls.filter(u => u.id !== id);
            saveUrls();
            renderUrls();
        }

        function renderUrls() {
            document.getElementById('urlList').innerHTML = urls.slice(0, 10).map(u => `
                <tr>
                    <td><span class="short-link" onclick="visitUrl(${u.id})">/${u.code}</span></td>
                    <td class="url-cell" title="${u.original}">${u.original}</td>
                    <td><span class="clicks-badge">${u.clicks} clicks</span></td>
                    <td><button class="delete-btn" onclick="deleteUrl(${u.id})"><i class="fas fa-trash"></i></button></td>
                </tr>
            `).join('');
        }

        renderUrls();
    </script>
</body>

</html>
