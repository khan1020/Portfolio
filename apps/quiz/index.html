<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizMaster - Test Your Knowledge</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header i {
            font-size: 3rem;
            color: #6366f1;
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 2rem;
            color: #1f2937;
        }

        .header p {
            color: #6b7280;
            margin-top: 10px;
        }

        .timer {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .timer-item {
            text-align: center;
        }

        .timer-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: #6366f1;
        }

        .timer-label {
            font-size: 0.8rem;
            color: #6b7280;
        }

        .progress-bar {
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            margin-bottom: 30px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            border-radius: 4px;
            transition: width 0.3s;
        }

        .question-number {
            font-size: 0.9rem;
            color: #6b7280;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 1.4rem;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            padding: 18px 24px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .option:hover {
            border-color: #6366f1;
            background: #f5f3ff;
        }

        .option.selected {
            border-color: #6366f1;
            background: #6366f1;
            color: white;
        }

        .option.correct {
            border-color: #10b981;
            background: #10b981;
            color: white;
        }

        .option.wrong {
            border-color: #ef4444;
            background: #ef4444;
            color: white;
        }

        .option-letter {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid currentColor;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
        }

        .btn-outline {
            background: white;
            border: 2px solid #6366f1;
            color: #6366f1;
        }

        .results {
            text-align: center;
        }

        .results .score {
            font-size: 5rem;
            font-weight: 700;
            color: #6366f1;
        }

        .results .score-label {
            font-size: 1.5rem;
            color: #6b7280;
            margin-bottom: 20px;
        }

        .leaderboard {
            margin-top: 30px;
            text-align: left;
        }

        .leaderboard h3 {
            margin-bottom: 15px;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            background: #f9fafb;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
        }

        #startScreen,
        #quizScreen,
        #resultScreen {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card" id="startScreen">
            <div class="header">
                <i class="fas fa-brain"></i>
                <h1>Web Development Quiz</h1>
                <p>Test your knowledge of HTML, CSS, and JavaScript</p>
            </div>
            <form onsubmit="startQuiz(event)">
                <div style="margin-bottom: 20px;">
                    <label style="display:block;margin-bottom:8px;font-weight:500;">Your Name</label>
                    <input type="text" id="playerName" required placeholder="Enter your name"
                        style="width:100%;padding:15px;border:2px solid #e5e7eb;border-radius:10px;font-size:1rem;">
                </div>
                <button type="submit" class="btn btn-primary"><i class="fas fa-play"></i> Start Quiz</button>
            </form>
            <div class="leaderboard" id="leaderboard"></div>
        </div>

        <div class="card" id="quizScreen">
            <div class="timer">
                <div class="timer-item">
                    <div class="timer-value" id="timeLeft">60</div>
                    <div class="timer-label">seconds</div>
                </div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress"></div>
            </div>
            <div class="question-number" id="questionNum">Question 1 of 10</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="options"></div>
        </div>

        <div class="card" id="resultScreen">
            <div class="results">
                <i class="fas fa-trophy" style="font-size:4rem;color:#f59e0b;margin-bottom:20px;"></i>
                <div class="score" id="finalScore">0</div>
                <div class="score-label">out of 10 correct</div>
                <button class="btn btn-primary" onclick="location.reload()"><i class="fas fa-redo"></i> Play
                    Again</button>
            </div>
        </div>

        <a href="../../index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Portfolio</a>
    </div>

    <script>
        const questions = [
            { q: 'What does HTML stand for?', options: ['Hyper Text Markup Language', 'High Tech Modern Language', 'Hyper Transfer Markup Language', 'Home Tool Markup Language'], answer: 0 },
            { q: 'Which CSS property changes text color?', options: ['font-color', 'text-color', 'color', 'text-style'], answer: 2 },
            { q: 'Which symbol is used for JavaScript comments?', options: ['/* */', '// or /* */', '# #', '<!-- -->'], answer: 1 },
            { q: 'What is the correct HTML tag for largest heading?', options: ['<heading>', '<h6>', '<h1>', '<head>'], answer: 2 },
            { q: 'Which property makes elements flexible in CSS?', options: ['display: flex', 'position: flex', 'flex: 1', 'float: flex'], answer: 0 },
            { q: 'How do you select an element by ID in JavaScript?', options: ['getElement(id)', 'getElementById()', 'selectId()', 'queryId()'], answer: 1 },
            { q: 'Which HTML attribute specifies an alternate text for an image?', options: ['title', 'src', 'alt', 'href'], answer: 2 },
            { q: 'What does CSS stand for?', options: ['Creative Style Sheets', 'Cascading Style Sheets', 'Computer Style Sheets', 'Colorful Style Sheets'], answer: 1 },
            { q: 'Which event occurs when a user clicks on an HTML element?', options: ['onmouseover', 'onchange', 'onclick', 'onmouseclick'], answer: 2 },
            { q: 'Which HTML tag is used to define an internal style sheet?', options: ['<css>', '<script>', '<style>', '<styles>'], answer: 2 }
        ];

        let scores = JSON.parse(localStorage.getItem('portfolio_quiz_scores')) || [];
        let currentQuestion = 0, score = 0, timer, timeLeft = 60, playerName = '';

        function saveScores() { localStorage.setItem('portfolio_quiz_scores', JSON.stringify(scores)); }

        function showLeaderboard() {
            const lb = document.getElementById('leaderboard');
            if (scores.length === 0) { lb.innerHTML = ''; return; }
            lb.innerHTML = `<h3><i class="fas fa-trophy"></i> Top Scores</h3>` +
                scores.sort((a, b) => b.score - a.score).slice(0, 5).map((s, i) =>
                    `<div class="leaderboard-item"><span>${i + 1}. ${s.name}</span><span>${s.score}/10</span></div>`
                ).join('');
        }

        function startQuiz(e) {
            e.preventDefault();
            playerName = document.getElementById('playerName').value;
            currentQuestion = 0; score = 0; timeLeft = 60;
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('quizScreen').style.display = 'block';
            showQuestion();
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timeLeft').textContent = timeLeft;
                if (timeLeft <= 0) endQuiz();
            }, 1000);
        }

        function showQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('questionNum').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
            document.getElementById('progress').style.width = ((currentQuestion + 1) / questions.length * 100) + '%';
            document.getElementById('questionText').textContent = q.q;
            document.getElementById('options').innerHTML = q.options.map((opt, i) =>
                `<div class="option" onclick="selectAnswer(${i})"><span class="option-letter">${String.fromCharCode(65 + i)}</span><span>${opt}</span></div>`
            ).join('');
        }

        function selectAnswer(index) {
            const q = questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            options.forEach((opt, i) => {
                opt.style.pointerEvents = 'none';
                if (i === q.answer) opt.classList.add('correct');
                else if (i === index) opt.classList.add('wrong');
            });
            if (index === q.answer) score++;
            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < questions.length) showQuestion();
                else endQuiz();
            }, 1000);
        }

        function endQuiz() {
            clearInterval(timer);
            scores.push({ name: playerName, score: score, date: Date.now() });
            saveScores();
            document.getElementById('quizScreen').style.display = 'none';
            document.getElementById('resultScreen').style.display = 'block';
            document.getElementById('finalScore').textContent = score;
        }

        document.getElementById('startScreen').style.display = 'block';
        showLeaderboard();
    </script>
</body>

</html>
